name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with black
        run: python -m black --version && python -m black --target-version py311 --check --diff gui/ utils/ scripts/ tests/

      - name: Check import order with isort
        run: isort --check-only --diff gui/ utils/ scripts/ tests/

      - name: Lint with flake8
        run: flake8 gui/ utils/ scripts/ tests/ --count --show-source --statistics

      - name: Type check with mypy
        run: mypy gui/ utils/ --ignore-missing-imports
