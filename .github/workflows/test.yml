name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion]"

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=utils --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml

  no-skip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion]"

      - name: Assert zero skipped tests (batch_processing/e2e/integration)
        run: |
          python -m pytest tests/batch_processing tests/e2e tests/integration -rs -q --junitxml=no-skip.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("no-skip.xml")
          total_skipped = 0
          for suite in tree.getroot().iter("testsuite"):
              skipped = int(suite.get("skipped", "0") or 0)
              if skipped:
                  total_skipped += skipped
                  print(f"FAIL: {suite.get('name')} has {skipped} skipped test(s)")
          if total_skipped:
              raise SystemExit(f"FAIL: {total_skipped} skipped test(s) in core suites")
          print("OK: zero skipped tests in tests/batch_processing, tests/e2e, tests/integration")
          PY

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion]"

      - name: Run bandit security scan
        run: bandit -r gui/ utils/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Run safety dependency check
        run: safety check --output json > safety-report.json
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
