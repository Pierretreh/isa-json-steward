name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Type check with mypy
        run: mypy gui/ utils/ --ignore-missing-imports

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ontology]"

      - name: Run tests with pytest
        shell: bash
        run: |
          pytest tests/ --junitxml=test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml --cov-report=xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov (ubuntu / py3.11 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  no-skip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion,ontology]"

      - name: Assert zero skipped tests (batch_processing/e2e/integration)
        shell: bash
        run: |
          python -m pytest tests/batch_processing tests/e2e tests/integration -rs -q --junitxml=no-skip.xml --no-cov
          python - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("no-skip.xml")
          total_skipped = 0
          for suite in tree.getroot().iter("testsuite"):
              skipped = int(suite.get("skipped", "0") or 0)
              if skipped:
                  total_skipped += skipped
                  print(f"FAIL: {suite.get('name')} has {skipped} skipped test(s)")
          if total_skipped:
              raise SystemExit(f"FAIL: {total_skipped} skipped test(s) in core suites")
          print("OK: zero skipped tests in tests/batch_processing, tests/e2e, tests/integration")
          PY

  conversion:
    name: conversion (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenSlide system library (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenslide0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion,ontology]"

      - name: Verify optional extras are importable
        shell: bash
        run: |
          python -c "import czifile, fcsparser, tifffile, readlif, openslide, owlready2, pyshacl; print('all optional extras importable')"

      - name: Run batch-processing and e2e tests
        shell: bash
        run: |
          pytest tests/batch_processing tests/e2e --junitxml=conversion-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: conversion-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion,ontology]"

      - name: Run bandit security scan
        run: bandit -r gui/ utils/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Run safety dependency check
        run: safety check --output json > safety-report.json
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
