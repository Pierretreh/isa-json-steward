name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Type check with mypy
        run: mypy gui/ utils/ --ignore-missing-imports

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ontology]"

      - name: Run tests with pytest
        shell: bash
        run: |
          pytest tests/ --cov=utils --cov-report=xml --cov-report=term-missing --cov-fail-under=60 --junitxml=test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      # P2-2 visual regression: the tests run inside the matrix above
      # (marked gui_visual; compare against platform-keyed baselines in
      # tests/gui/baselines/, skip on platforms without a committed set).
      # On failure the expected/actual/diff PNGs land in reports/visual_diff/
      # and are uploaded for agent/vision review.
      - name: Upload visual-regression diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/visual_diff/
          if-no-files-found: ignore

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov (ubuntu / py3.11 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  no-skip:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pytest-qt loads QtGui at pytest_configure for EVERY pytest run, so
      # even non-GUI suites need Qt's system libraries (libEGL.so.1) and the
      # offscreen platform env to collect tests on Ubuntu.
      - name: Install Qt system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion,ontology]"

      - name: Assert zero skipped tests (batch_processing/e2e/integration)
        shell: bash
        run: |
          python -m pytest tests/batch_processing tests/e2e tests/integration -rs -q --junitxml=no-skip.xml --no-cov
          python - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse("no-skip.xml")
          total_skipped = 0
          for suite in tree.getroot().iter("testsuite"):
              skipped = int(suite.get("skipped", "0") or 0)
              if skipped:
                  total_skipped += skipped
                  print(f"FAIL: {suite.get('name')} has {skipped} skipped test(s)")
          if total_skipped:
              raise SystemExit(f"FAIL: {total_skipped} skipped test(s) in core suites")
          print("OK: zero skipped tests in tests/batch_processing, tests/e2e, tests/integration")
          PY

  conversion:
    name: conversion (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenSlide and Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenslide0 \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion,ontology]"

      - name: Verify optional extras are importable
        shell: bash
        run: |
          python -c "import czifile, fcsparser, tifffile, readlif, openslide, owlready2, pyshacl; print('all optional extras importable')"

      - name: Run batch-processing and e2e tests
        shell: bash
        run: |
          pytest tests/batch_processing tests/e2e --junitxml=conversion-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: conversion-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  visual-baselines:
    # P2-2 baseline refresh path -- manual dispatch ONLY (never on
    # push/PR).  Regenerates the platform-keyed visual baselines ON the CI
    # runners and uploads tests/gui/baselines/ as an artifact to review and
    # commit.  This is the runner-side half of the documented refresh
    # workflow (AGENTS.md sections 9/10); local runs use
    # ISA_STEWARD_UPDATE_BASELINES=1 pytest -m gui_visual.
    if: github.event_name == 'workflow_dispatch'
    name: visual baselines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate baselines on this runner
        shell: bash
        run: |
          ISA_STEWARD_UPDATE_BASELINES=1 python -m pytest tests/gui/test_visual_regression.py -m gui_visual -q

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.os }}
          path: tests/gui/baselines/
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,conversion,ontology]"

      - name: Run bandit security scan
        run: bandit -r gui/ utils/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Run safety dependency check
        run: safety check --output json > safety-report.json
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
