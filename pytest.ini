[pytest]
# Pytest configuration for ISA-JSON Data Steward

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
# Coverage is intentionally NOT gated here (E-1): the --cov=utils
# --cov-fail-under=60 gate runs only in CI (.github/workflows/test.yml), so
# bare runs (e.g. QT_QPA_PLATFORM=offscreen pytest -m gui) work without
# pytest-cov installed and never fail on the gate.
addopts =
    --verbose
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external resources)
    e2e: End-to-end tests (slowest, full pipeline)
    slow: Slow-running tests
    gui: GUI-related tests (requires PyQt6)
    gui_widget: GUI widget tests
    gui_page: GUI page tests
    gui_dialog: GUI dialog tests
    gui_workflow: GUI workflow tests
    gui_visual: GUI visual-regression baseline tests (P2-2)
    batch: Batch processing tests
    batch_component: Batch component tests
    batch_pipeline: Batch pipeline tests
    security: Security-related tests
    file_ops: File operation tests
    isa_validation: ISA-JSON validation tests
    requires_data: Tests requiring representative dataset

# Coverage configuration
[coverage:run]
source = utils, gui
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    gui/main.py
    gui/app.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
