repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Binary instrument-data fixtures (Zeiss CZI, FlowJo WSP, and the
        # PNG-sidecar metadata XML) must not be line-normalized.
        exclude: |
          (?x)^(
            tests/batch_processing/fixtures/.*\.czi
          | tests/batch_processing/fixtures/.*\.wsp
          | tests/batch_processing/fixtures/.*\.png_metadata\.xml
          )$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ['--line-length=100']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100']
