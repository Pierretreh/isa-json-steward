[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isa-json-steward"
version = "2.0.0"
description = "ISA-JSON Data Steward — a desktop application and toolkit for managing ISA-JSON investigation metadata"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "ISA-JSON Data Steward Contributors"}
]
keywords = ["ontology", "isa-json", "fair-data", "pyqt6", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

dependencies = [
    "PyQt6>=6.6.0",
    "rdflib>=7.0.0",
    "Biopython>=1.83",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "isatools>=0.14.3",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=26.5.1",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "pre-commit>=3.0.0",
]
ontology = [
    "owlready2>=0.40",
    "pyshacl>=0.40",
]
conversion = [
    "czifile>=2019.7.2",
    "fcsparser>=0.2.4",
    "tifffile>=2023.4.12",
    "openslide-python>=1.3.1",
    "readlif>=0.6.5",
]

[project.scripts]
isa-json-steward-gui = "gui.main:main"
isa-json-steward-batch = "utils.batch.batch_processor:main"

[project.urls]
Homepage = "https://github.com/isa-json-data-steward/isa-json-steward"
Documentation = "https://github.com/isa-json-data-steward/isa-json-steward#readme"
Repository = "https://github.com/isa-json-data-steward/isa-json-steward.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "gui*"]

[tool.setuptools.package-data]
gui = ["resources/styles/*.qss"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | archive
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["utils", "gui"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.report]
fail_under = 60
